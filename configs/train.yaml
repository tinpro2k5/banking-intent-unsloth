model_name: "unsloth/llama-3-8b-bnb-4bit"   # or unsloth/llama-3.1-8b-unsloth-bnb-4bit
max_seq_length: 128
batch_size: 8
learning_rate: 2e-4
num_epochs: 3
optimizer: "adamw_8bit"
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
train_data: "sample_data/train.csv"
test_data: "sample_data/test.csv"
label_map: "configs/label_map.json"
output_dir: "checkpoints/banking-intent"